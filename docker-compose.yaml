version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_zen_test
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: benomar10
      MYSQL_DATABASE: zenDB
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
  
  zenml:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenml_server
    restart: unless-stopped
    environment:
      ZENML_DATABASE_URI: mysql+mysqlconnector://root:benomar10@mysql/zenDB
      ZENML_SERVER_HOST: "0.0.0.0"
      ZENML_SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    volumes:
      - ./zenml_data:/zenml_data


